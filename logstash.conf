
input {
  # Logstash GELF input plugin listens on port 12201 for UDP messages
  gelf {
    port => 12201
    type => "gelf"
  }
}

filter {
  # Optional: You can add filters here to modify or enrich the log data. 
  # E.g., using a JSON filter if your Fastify logs are JSON-formatted 
  # before GELF encapsulation.
}

output {
  # Output to stdout with rubydebug codec for easy inspection 
  # in the docker-compose logs
  stdout {
    codec => rubydebug
  }
}
