filebeat.inputs:
  - type: container
    paths:
      - '/var/lib/docker/containers/*/*.log'
    
    # Parse JSON logs from Docker
    processors:
      - add_docker_metadata:
          host: "unix:///var/run/docker.sock"
          match_fields:
            - "container.id"
      
      # Add custom fields
      - add_fields:
          target: ''
          fields:
            app: pingpong
      
      # Decode JSON log messages
      - decode_json_fields:
          fields: ["message"]
          target: ""
          overwrite_keys: true
      
      # Drop healthcheck logs (optional)
      - drop_event:
          when:
            contains:
              container.name: "healthcheck"

# Output to Logstash
output.logstash:
  hosts: ["logstash:5044"]
  
  # Load balancing and failover
  loadbalance: true
  
  # Retry settings
  max_retries: 3
  timeout: 30

# Logging
logging.level: info
logging.to_stderr: true

# Monitoring
monitoring.enabled: false

# Registry file location
filebeat.registry.path: /usr/share/filebeat/data/registry
