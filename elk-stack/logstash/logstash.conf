
input {
  # Logstash GELF input plugin listens on port 12201 for UDP messages
  gelf {
    port => 12201
    type => "gelf"
  }
}

filter {
}

output {
  elasticsearch {
    # The host is the name of the Elasticsearch service in docker-compose
    hosts => ["elasticsearch:9200"]
    # The index is how logs are grouped. 
    # The pattern 'fastify-gelf-%{+YYYY.MM.dd}' creates a new index daily.
    index => "logs-%{+YYYY.MM.dd}"
    # Remove the Logstash `type` field to avoid future warnings
    ecs_compatibility => disabled 
    user => "elastic" 
    password => "${ELASTIC_PASSWORD}"
  }
}
