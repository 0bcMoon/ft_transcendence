apiVersion: 1

contactPoints:
  - orgId: 1
    name: 'Discord-Alerts'
    receivers:
      - uid: discord_webhook
        type: discord
        settings:
          url: ${DISCORD_WEBHOOK}

policies:
  - orgId: 1
    receiver: 'Discord-Alerts'
    group_by: ['alertname', 'severity']
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: 'Discord-Alerts'
        object_matchers:
          - ['severity', '=', 'critical']

