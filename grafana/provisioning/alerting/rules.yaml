apiVersion: 1
groups:
    - orgId: 1
      name: Nginx LTc
      folder: Alerts
      interval: 10s
      rules:
        - uid: efc94xj2j5n9ca
          title: Nginx Status
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: PBFA97CFB590B2093
              model:
                editorMode: builder
                expr: nginx_up{instance="nginx-exporter:9113"}
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 0
                        type: eq
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          keepFiringFor: 1m
          annotations:
            summary: Nginx is Down!!!!!!
          labels: {}
          isPaused: false
          notification_settings:
            receiver: 'Discord-Alerts'
