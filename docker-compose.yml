services:
  backend:
    build: ./app/backend
    container_name: backend
    env_file:
      - .env
    networks:
      - pingpong
    volumes:
      - database:/app/sqliteDB
      - images:/app/public/uploads

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
      args:
        VITE_API_URL: 
        VITE_WS_URL: 
    container_name: nginx
    networks: 
      - pingpong
    volumes:
      - images:/var/www/uploads
      - ./nginx/ssl:/etc/nginx/ssl
    ports:
      - 8080:443

  nginx-exporter:
      image: nginx/nginx-prometheus-exporter:latest
      container_name: nginx-exporter
      command:
        - "--nginx.scrape-uri=https://nginx:443/stub_status"
      networks: 
        - pingpong
      depends_on:
        - nginx

  node-exporter:
    image: prom/node-exporter
    container_name: node-exporter
    networks: 
      - pingpong

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: 
      - pingpong
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - 9000:3000
    env_file:
      - .env
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_volume:/var/lib/grafana
    networks:
      - pingpong
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped

volumes:

  images:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/images
  database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/database
  grafana_volume:

networks:
  pingpong:
    name: pingpong
