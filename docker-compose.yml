volumes:

  elasticsearch-data: 

  images:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/images
  database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/database
  grafana_volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./grafana-data

networks:
  pingpong:
    name: pingpong
