  redis:
    container_name: redis
    build: ./redis
    ports:
      - "9090:6379"
    env_file:
      - .env

volumes:
  backend:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/app/backend

  frontend:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/app/frontend

networks:
  pingpong:
    name: pingpong
