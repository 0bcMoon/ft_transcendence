services:
  backend: 
    build: ./backend/
    container_name: 'backend'
    ports:
      - "3000:3000"
    restart: always
    volumes:
      - backend:/usr/local/app
  frontend:
    build: ./frontend
    container_name: 'frontend'
    ports:
      - "5173:5173"
    volumes:
      - frontend:/usr/local/app

volumes:
  backend:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/backend

  frontend:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/frontend
