volumes:
  elasticsearch-data: # Define the named volume for persistence

  backend:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/app/backend

  frontend:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/app/frontend

networks:
  pingpong:
    name: pingpong
