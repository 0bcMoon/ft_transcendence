services:
  backend:
    build: ./app/backend
    container_name: backend
    env_file:
      - .env
    # logging:
    #   driver: "gelf"
    #   options:
    #     gelf-address: "udp://localhost:12201"
    #     tag: "backend"
    networks:
      - pingpong
    volumes:
      - ./database:/app/sqliteDB
      - images:/app/public/uploads
    # depends_on:
    #   logstash:
    #     condition: service_healthy

  nginx:
    build:
      context: ./app/frontend/
      args:
        - VITE_API_URL=
        - VITE_WS_URL=
    container_name: nginx
    networks:
      - pingpong
    volumes:
      # Mount nginx config as volume
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - images:/var/www/uploads
      - ./nginx/ssl:/etc/nginx/ssl
    ports:
      - 8080:443 # change it to 443

