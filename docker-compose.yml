volumes:
  elasticsearch-data: # Define the named volume for persistence

  images:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/images
  database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PWD}/database

networks:
  pingpong:
    name: pingpong
